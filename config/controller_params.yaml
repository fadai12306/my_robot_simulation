# 智能混合控制器参数配置
# 所有可调参数集中于此，修改后重启节点即可生效，无需重新编译

smart_hybrid_controller:
  ros__parameters:
    # ==================== 避障参数 ====================
    min_distance: 0.5                # 前方障碍物检测阈值（米），低于此值触发避障
    side_min_distance: 0.3           # 侧方安全距离（预留扩展用）
    front_angle_range_deg: 30        # 前方检测角度范围（度），左右各30度，共60度扇区

    # ==================== 速度参数 ====================
    linear_speed: 0.15               # 自动避障模式线速度（米/秒），保守策略
    angular_speed: 0.8                # 自动避障模式角速度（弧度/秒），快速转向脱困

    # ==================== 优先级管理参数 ====================
    keyboard_timeout: 3.0            # 键盘控制超时时间（秒），超过后切换为自动模式

    # ==================== 智能转向参数 ====================
    turn_threshold: 0.2              # 转向显著性阈值（米），左右空间差距超过此值才切换方向
    default_turn_direction: "right"    # 默认转向方向（"left"或"right"），空间相近时的 fallback
